name: Build 2025 B modeling Word plan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-modeling-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-word:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          python -m pip install python-docx==1.2.0
      - name: Generate and validate editable Word document
        run: python scripts/build_modeling_plan.py
      - name: Commit finished Word file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'docs/2025B-建模思路与实施方案.docx'
          if git diff --cached --quiet; then
            echo 'No document changes'
            exit 0
          fi
          git commit -m 'docs: add editable 2025 B modeling proposal Word document'
          git push
